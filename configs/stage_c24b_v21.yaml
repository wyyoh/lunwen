        - "For {entity}, identify the relation named by the public phrase '{relation_phrase}'."
        - "Choose the typed field requested of {entity} from this wording: {relation_phrase}."
      known_families:
        registry_id:
          v21_train_registry_conservancy_accession: public conservancy accession number
          v21_train_registry_estate_intake: court estate intake reference
          v21_train_registry_professional_roll: professional roll entry number
