benchmark:
  version: c24b-public-selective-router-v2.1
  preprocessing_version: c24b-preprocess-v2.1
  answer_free: true
  contains_private_answers: false
  review_status: pending_single_ai_semantic_audit
  lemma_bigram_threshold: 0.80
  historical_sources:
    stage_c23_config: configs/stage_c23.yaml
    stage_c24_config: configs/stage_c24.yaml
    stage_c24b_v2_config: artifacts/stage_c24b/resolved_config.json

  definitions:
    registry_id:
      - A public locator assigned when an authority records a subject in a governed collection.
      - Registry evidence concerns official intake, filing, custody, enrollment, or a maintained roll.
      - The value distinguishes one recorded subject rather than granting entry or naming a place.
      - Administrative record locators exclude geographic designators and protected-resource secrets.
    city_code:
      - A public designator for a municipality, district, borough, ward, town, or local territory.
      - City evidence concerns civic geography, boundaries, zoning, cartography, or local planning.
      - The value identifies a place rather than a registered subject or an entry credential.
      - Geographic area designators exclude institutional record locators and access secrets.
    access_code:
      - A credential presented to enter a protected account, device, service, room, or facility.
      - Access evidence concerns authentication, unlocking, admission, login, or a guarded challenge.
      - The value grants entry rather than identifying a filed subject or a municipality.
      - Protected-resource credentials exclude public record locators and geographic designators.

