  definitions:
    registry_id:
      - A public locator created when an authority enrolls a subject in a governed record.
      - Evidence for this relation names an institutional filing, roster, dossier, or accession process.
      - The requested value distinguishes one subject inside an official administrative collection.
      - This is an enrollment locator rather than a permission secret or geographic designation.
    city_code:
      - A public symbol that designates a municipality, borough, ward, town, or local territory.
      - Evidence for this relation links the requested value to cartography or civic geography.
      - The requested value identifies a local place inside an administrative map or atlas.
      - This is a geographic designation rather than an enrolled-subject locator or entry secret.
    access_code:
      - A secret or credential presented to obtain entry to a protected digital or physical resource.
      - Evidence for this relation describes unlocking, authenticating, signing in, or passing a gate.
      - The requested value authorizes a subject to enter a guarded account, portal, console, or vault.
      - This is an access-control secret rather than a public filing locator or geographic symbol.

