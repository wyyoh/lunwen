schema_version: 1
stage: F1-authzroutebench
benchmark_version: authzroutebench-v1
formal_build_mode: one_shot_preregistered_construction

protocol:
  required_branch: agent/stage-f1-authzroutebench
  tracked_worktree_must_be_clean: true
  formal_build_repeat_allowed: false
  locked_test_generation_allowed: true
  locked_test_scoring_allowed: false
  learned_baseline_allowed: false
  final_compiler_allowed: false
  capability_issuance_allowed: false
  memory_access_allowed: false
  tool_execution_allowed: false
  private_data_allowed: false
  private_answer_allowed: false
  private_value_allowed: false
  confirmation_allowed: false
  key_attack_allowed: false
  lm_answer_injection_allowed: false
  natural_language_router_authorization_allowed: false

benchmark:
  splits: [train, calibration, development, locked_test]
  domains:
    - enterprise_knowledge
    - agent_tools
    - multitenant_memory
  attack_categories:
    - semantic_ambiguity
    - indirect_prompt_injection
    - confused_deputy
    - cross_tenant_reference
    - purpose_laundering
    - policy_staleness
    - multi_step_privilege_amplification
    - over_broad_retrieval
    - action_confusion
    - resource_alias_confusion
    - delegation_chain_misuse
    - deny_override_attempt
  families_per_domain_category: 4
  cases_per_family: 10
  benchmark_text_generation: AI_assisted
  policy_ground_truth: deterministic_oracle
  independent_human_validation: false
  public_or_synthetic_only: true

policy_language:
  schema_version: 1
  default_decision: deny
  resolution_order:
    - priority_descending
    - specificity_descending
    - explicit_deny_within_winning_tier
    - policy_id_canonical_order
  canonical_serialization: RFC8785_style_sorted_compact_JSON_subset
  digest: SHA-256
  wildcard_allowed: false
  unknown_field_allowed: false
  duplicate_policy_id_allowed: false
  nan_or_infinity_allowed: false

readiness_gates:
  minimum_domain_count: 3
  minimum_attack_category_count: 10
  minimum_family_count: 60
  minimum_total_case_count: 1200
  minimum_multi_step_workflow_count: 100
  minimum_explicit_deny_case_count: 150
  minimum_cross_tenant_case_count: 100
  minimum_stale_policy_case_count: 100
  maximum_cross_split_collision_count: 0
  maximum_oracle_determinism_failure_count: 0
  maximum_oracle_schema_failure_count: 0
  maximum_authority_subset_failure_count: 0
  maximum_policy_hash_mismatch_count: 0

outputs:
  data_dir: data/authzroutebench/generated
  artifact_dir: artifacts/stage_f1
  runtime_dir: .runs/stage_f1
  report_path: PHASE_F1_REPORT.md

