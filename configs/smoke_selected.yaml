name: smoke_selected
model:
  vocab_size: 4096
  context_length: 128
  num_layers: 6
  num_heads: 6
  num_kv_heads: 2
  hidden_size: 384
  core_ffn_width: 1536
  aux_ffn_width: 256
  num_aux: 1
  eos_token_id: 1
data:
  data_dir: data/stories-smoke
  private_label: alien-encounters
  train_fraction: 1.0
  eval_sequences_per_core_label: 20
  max_private_eval_sequences: 200
training:
  seed: 0
  epochs: 1
  max_steps: 0
  micro_batch_size: 8
  accumulation_steps: 16
  learning_rate: 0.005
  weight_decay: 0.01
  warmup_fraction: 0.1
  decay_fraction: 0.1
  aux_route_probability: 0.1
  core_robust_probability: 0.5
  dtype: bfloat16
  compile: false
  checkpoint_every: 250
